[project]
name = "vault-tools"
version = "0.1.0"
description = "Knowledge vault utilities: digest, tension index, wiki-link graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "duckdb>=1.1.0",
    "local-first-common>=0.1.0",
]

[project.scripts]
vault-digest = "vault_tools.digest.cli:main"
tension-index = "vault_tools.tension_index.cli:main"
vg = "vault_tools.wiki_graph.cli:main"
wsearch = "vault_tools.weighted_search.cli:main"
tool-doc-audit = "vault_tools.tool_doc_audit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
local-first-common = { git = "https://github.com/jamalhansen/local-first-common.git", branch = "main" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]
